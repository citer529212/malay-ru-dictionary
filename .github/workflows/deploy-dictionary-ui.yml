name: Deploy Dictionary UI

on:
  push:
    branches:
      - main
      - master
    paths:
      - "dictionary-ui/**"
      - ".github/workflows/deploy-dictionary-ui.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify dictionary quality
        run: node dictionary-ui/tools/qa_dictionary_search.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dictionary-ui

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
